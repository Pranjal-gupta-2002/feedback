name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-be.yml'
  workflow_dispatch:

env:
  GCP_REGION: asia-south1
  SERVICE_NAME: feedback-backend
  IMAGE_NAME: feedback-backend

jobs:
  deploy-backend:
    name: Build, Push & Deploy BE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Authenticate with Google Cloud using Service Account JSON Key
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Set up Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. Build and Push Backend Docker image to GCR and Docker Hub
      - name: Build and Push Backend Docker Image
        run: |
          gcloud auth configure-docker --quiet
          PROJECT_ID=$(gcloud config get-value project)
          GCR_TAG="gcr.io/${PROJECT_ID}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          GCR_LATEST="gcr.io/${PROJECT_ID}/${{ env.IMAGE_NAME }}:latest"
          DH_TAG="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          DH_LATEST="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"

          docker build \
            -t "$GCR_TAG" \
            -t "$GCR_LATEST" \
            -t "$DH_TAG" \
            -t "$DH_LATEST" \
            ./backend

          # Push to GCR (Google Cloud native registry - guarantees Cloud Run deployment succeeds)
          docker push "$GCR_TAG"
          docker push "$GCR_LATEST"

          # Also push to Docker Hub (optional backup)
          docker push "$DH_TAG" || true
          docker push "$DH_LATEST" || true

          echo "IMAGE_REF=$GCR_TAG" >> $GITHUB_ENV

      # 5. Deploy to Google Cloud Run with GitHub Secrets
      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.IMAGE_REF }}" \
            --region ${{ env.GCP_REGION }} \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300 \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 10 \
            --cpu-boost \
            --set-env-vars "^##^PROJECT_NAME=PulseReview Enterprise Moderation System##DATABASE_NAME=feedback_db##API_V1_STR=/api##MONGODB_URL=${{ secrets.MONGODB_URL || secrets.MONGODB_URI }}##MONGODB_URI=${{ secrets.MONGODB_URL || secrets.MONGODB_URI }}"

      - name: Print Backend Service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "=========================================="
          echo "Backend successfully deployed to: ${URL}"
          echo "=========================================="

      # 6. Auto-clean old images in GCR to keep storage minimal
      - name: Prune Old Images from GCR
        if: success()
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          echo "Pruning older backend image revisions to maintain minimal storage..."
          gcloud container images list-tags "gcr.io/${PROJECT_ID}/${{ env.IMAGE_NAME }}" \
            --filter="NOT tags:latest AND NOT tags:${{ github.sha }}" \
            --format="get(digest)" | while read -r digest; do
              if [ -n "$digest" ]; then
                echo "Removing previous digest: $digest"
                gcloud container images delete "gcr.io/${PROJECT_ID}/${{ env.IMAGE_NAME }}@${digest}" --quiet --force-delete-tags || true
              fi
          done

      - name: Fetch Cloud Run Diagnostic Logs
        if: failure()
        run: |
          echo "=== Cloud Run Diagnostic Logs for ${{ env.SERVICE_NAME }} ==="
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=${{ env.SERVICE_NAME }}" \
            --limit 100 \
            --format="value(timestamp,severity,textPayload,jsonPayload.message)" || true
