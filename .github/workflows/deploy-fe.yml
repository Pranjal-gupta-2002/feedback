name: Deploy Frontend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-fe.yml'
  workflow_dispatch:

env:
  GCP_REGION: us-central1
  BE_REGION: asia-south1
  BE_SERVICE_NAME: feedback-backend
  FE_SERVICE_NAME: feedback-frontend
  IMAGE_NAME: feedback-frontend

jobs:
  deploy-frontend:
    name: Build, Push & Deploy FE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Authenticate with Google Cloud
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Set up Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. Fetch the live Backend URL from Cloud Run
      - name: Get Backend URL
        run: |
          BE_URL=$(gcloud run services describe ${{ env.BE_SERVICE_NAME }} --region ${{ env.BE_REGION }} --format 'value(status.url)' 2>/dev/null || echo "")
          if [ -n "$BE_URL" ]; then
            echo "LIVE_API_URL=${BE_URL}" >> $GITHUB_ENV
            echo "Configured API URL: ${BE_URL}"
          else
            echo "LIVE_API_URL=https://feedback-backend-1029614513378.asia-south1.run.app" >> $GITHUB_ENV
            echo "Backend service not yet found; using known fallback"
          fi

      # 5. Generate .env.production file dynamically
      - name: Generate .env.production & Configure Nginx
        run: |
          cat <<EOF > ./frontend/.env.production
          VITE_API_URL=${{ env.LIVE_API_URL }}
          VITE_API_BASE_URL=${{ env.LIVE_API_URL }}
          EOF
          echo "Generated .env.production successfully"

          # Update nginx proxy_pass with the live backend URL
          sed -i "s|BACKEND_URL_PLACEHOLDER|${{ env.LIVE_API_URL }}|g" ./frontend/nginx.conf || true

      # 6. Build and Push Frontend Docker image to GCR and Docker Hub
      - name: Build and Push Frontend Docker Image
        run: |
          gcloud auth configure-docker --quiet
          PROJECT_ID=$(gcloud config get-value project)
          GCR_TAG="gcr.io/${PROJECT_ID}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          GCR_LATEST="gcr.io/${PROJECT_ID}/${{ env.IMAGE_NAME }}:latest"
          DH_TAG="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          DH_LATEST="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"

          docker build \
            -t "$GCR_TAG" \
            -t "$GCR_LATEST" \
            -t "$DH_TAG" \
            -t "$DH_LATEST" \
            ./frontend

          # Push to GCR (Google Cloud native registry - guarantees Cloud Run deployment succeeds)
          docker push "$GCR_TAG"
          docker push "$GCR_LATEST"

          # Also push to Docker Hub (optional backup)
          docker push "$DH_TAG" || true
          docker push "$DH_LATEST" || true

          echo "IMAGE_TAG=$GCR_TAG" >> $GITHUB_ENV

      # 7. Deploy to Google Cloud Run
      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy ${{ env.FE_SERVICE_NAME }} \
            --image "${{ env.IMAGE_TAG }}" \
            --region ${{ env.GCP_REGION }} \
            --port 80 \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 10

      - name: Print Frontend Service URL
        run: |
          URL=$(gcloud run services describe ${{ env.FE_SERVICE_NAME }} --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "=========================================="
          echo "Frontend successfully deployed to: ${URL}"
          echo "=========================================="

      # 8. Auto-clean old images in GCR to keep storage under 50MB (well below 500MB cap)
      - name: Prune Old Images from GCR
        if: success()
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          echo "Pruning older image revisions to maintain minimal storage..."
          gcloud container images list-tags "gcr.io/${PROJECT_ID}/${{ env.IMAGE_NAME }}" \
            --filter="NOT tags:latest AND NOT tags:${{ github.sha }}" \
            --format="get(digest)" | while read -r digest; do
              if [ -n "$digest" ]; then
                echo "Removing previous digest: $digest"
                gcloud container images delete "gcr.io/${PROJECT_ID}/${{ env.IMAGE_NAME }}@${digest}" --quiet --force-delete-tags || true
              fi
          done

      - name: Fetch Cloud Run Diagnostic Logs
        if: failure()
        run: |
          echo "=== Cloud Run Diagnostic Logs for ${{ env.FE_SERVICE_NAME }} ==="
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=${{ env.FE_SERVICE_NAME }}" \
            --limit 100 \
            --format="value(timestamp,severity,textPayload,jsonPayload.message)" || true
